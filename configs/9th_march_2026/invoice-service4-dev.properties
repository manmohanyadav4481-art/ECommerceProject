
# ==============================
# APPLICATION
# ==============================
spring.application.name=invoice-service4

# ==============================
# SERVER
# ==============================
server.port=8081

# ==============================
# MYSQL DATABASE
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/order_service_db4
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# UPSTASH REDIS
# ==============================
spring.data.redis.host=arriving-dingo-185506.upstash.io
spring.data.redis.port=6379
spring.data.redis.password=${UPSTASH_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# ==============================
# REDIS CACHE
# ==============================
spring.cache.type=redis

# ==============================
# ACTUATOR
# ==============================
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env,loggers
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

# ==============================
# APPLICATION INFORMATION
# ==============================
info.app.name=invoice-service4
info.app.version=1.0
info.app.description=Java Backend Application
